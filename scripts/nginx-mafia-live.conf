# Live nginx for mafiawars.co.uk — keep in sync with scripts/nginx-mafia-https.conf.example

server {
    listen 80;
    server_name mafiawars.co.uk www.mafiawars.co.uk;

    root /var/www/html;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mafiawars.co.uk www.mafiawars.co.uk;

    ssl_certificate     /etc/letsencrypt/live/mafiawars.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mafiawars.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    root /opt/mafia-app/build;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
