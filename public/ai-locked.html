<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Locked — System AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, #3a1a08 0%, #0a0908 55%, #050403 100%);
      color: #f5e6c8;
      font-family: "Cinzel", "Times New Roman", serif;
    }
    .glow {
      position: fixed;
      inset: auto 0 18% 0;
      height: 280px;
      background: radial-gradient(circle, rgba(251,191,36,0.18), transparent 70%);
      pointer-events: none;
    }
    .card {
      position: relative;
      width: 100%;
      max-width: 560px;
      text-align: center;
      padding: 40px 28px 32px;
      border: 1px solid rgba(251,191,36,0.45);
      background: rgba(12, 10, 8, 0.88);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 24px 80px rgba(0,0,0,0.55);
    }
    .eyebrow {
      margin: 0 0 10px;
      font-size: 11px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #fbbf24;
    }
    .label {
      margin: 0 0 18px;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #c4b08a;
    }
    .insult {
      margin: 0 0 18px;
      font-size: clamp(34px, 8vw, 64px);
      line-height: 0.95;
      letter-spacing: 0.04em;
      color: #fff4d4;
      text-shadow: 0 0 28px rgba(251,191,36,0.35);
    }
    .line {
      margin: 0 0 28px;
      font-size: 16px;
      color: #e8d7a8;
    }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    button {
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 12px 18px;
      cursor: pointer;
      background: transparent;
      color: #fbbf24;
      border: 1px solid rgba(251,191,36,0.55);
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <p class="eyebrow">System AI</p>
    <p class="label">You have been locked</p>
    <h1 class="insult" id="insult">DICKHEAD</h1>
    <p class="line" id="line">System AI locked you.</p>
    <div class="actions">
      <button type="button" id="reroll">Another one</button>
    </div>
  </div>
  <script>
    var INSULTS = ["DICKHEAD","KNOBHEAD","MELT","PLANK","CLOWN","MUPPET","DOUGHNUT","NUMPTY","PILLLOCK","PLONKER","WALLY","TWONK","WET WIPE","HELMET","TOOL","DIV","BELLEND","WINDOW LICKER","ABSOLUTE UNIT OF A FOOL","PROFESSIONAL IDIOT"];
    var LINES = ["System AI locked you.","You can look. You cannot play.","Sit there until I get bored.","This is not an investigation. This is a timeout.","The city is still running. You are not.","Ask nicely and I might still leave you here."];
    function pick() {
      document.getElementById("insult").textContent = INSULTS[Math.floor(Math.random() * INSULTS.length)];
      document.getElementById("line").textContent = LINES[Math.floor(Math.random() * LINES.length)];
    }
    pick();
    document.getElementById("reroll").onclick = pick;
  </script>
</body>
</html>
