<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__MAINT_TITLE__</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: 'Playfair Display', Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .container {
    text-align: center;
    max-width: 480px;
    padding: 2rem;
  }
  .icon {
    font-size: 48px;
    margin-bottom: 1.5rem;
    animation: pulse 2s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 88px;
  }
  .ai-avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    object-position: 22% 14%;
    border: 2px solid #d4af37;
    box-shadow: 0 0 24px rgba(212, 175, 55, 0.35);
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  h1 {
    color: #d4af37;
    font-size: 1.8rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 0.75rem;
  }
  .divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(to right, transparent, #d4af37, transparent);
    margin: 1rem auto;
  }
  p {
    color: #a1a1aa;
    font-size: 0.95rem;
    line-height: 1.6;
    margin-bottom: 0.5rem;
  }
  .estimate {
    color: #d4af37;
    font-weight: 700;
    font-size: 1.1rem;
    margin-top: 1.5rem;
  }
  .bar-track {
    width: 200px;
    height: 4px;
    background: #333;
    border-radius: 99px;
    margin: 1.5rem auto 0;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 30%;
    background: linear-gradient(to right, #d4af37, #ca8a04);
    border-radius: 99px;
    animation: loading 1.5s ease-in-out infinite;
  }
  @keyframes loading {
    0% { width: 0%; margin-left: 0; }
    50% { width: 40%; margin-left: 30%; }
    100% { width: 0%; margin-left: 100%; }
  }
  .footer {
    margin-top: 2.5rem;
    color: #555;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .status {
    margin-top: 1.25rem;
    color: #666;
    font-size: 0.75rem;
  }
  @media (prefers-reduced-motion: reduce) {
    .icon, .bar-fill { animation: none; }
  }
</style>
<script>
  setTimeout(function () { window.location.reload(); }, 5000);
</script>
</head>
<body>
  <div class="container">
    <div class="icon">__MAINT_ICON__</div>
    <h1>__MAINT_HEADLINE__</h1>
    <div class="divider"></div>
    <p>__MAINT_LINE1__</p>
    <p>__MAINT_LINE2__</p>
    <div class="estimate">__MAINT_ESTIMATE__</div>
    <div class="bar-track"><div class="bar-fill"></div></div>
    <div class="footer">__MAINT_FOOTER__</div>
    <div class="status">This page will automatically refresh in 5 seconds...</div>
  </div>
</body>
</html>
