# Installed to /etc/systemd/system/mafia-backend.service.d/ by scripts/apply-maintenance.sh.
# Caps how long a restart waits for open connections, so the maintenance page is up for seconds, not a minute.
[Service]
ExecStart=
ExecStart=/opt/mafia-app/backend/venv/bin/uvicorn server:app --host 127.0.0.1 --port 8000 --timeout-graceful-shutdown 3
TimeoutStopSec=10
